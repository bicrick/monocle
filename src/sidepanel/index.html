<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monocle</title>
    <link rel="icon" href="../icons/icon32.png" type="image/png" />
    <link rel="stylesheet" href="./sidepanel.css" />
    <link rel="stylesheet" href="./textShimmer.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <button
          type="button"
          id="history-toggle"
          class="history-toggle"
          aria-expanded="false"
          aria-controls="history-panel"
        >
          <span class="history-chevron" aria-hidden="true"></span>
          <span class="history-label">History</span>
          <span id="history-count" class="history-count">0</span>
        </button>
        <button type="button" id="chat-title" class="chat-title" disabled>
          New chat
        </button>
        <button type="button" id="new-btn" class="ghost history-new" title="New chat">
          New
        </button>
      </header>
      <div class="workspace">
        <aside
          id="history-panel"
          class="history-panel"
          aria-label="Chat history"
          aria-hidden="true"
        >
          <div id="history-list" class="history-list" role="list"></div>
        </aside>
        <div id="chat-stage" class="chat-stage">
          <main id="transcript" aria-live="polite"></main>
          <div id="log-host" hidden></div>
          <footer id="composer">
            <div class="composer-row">
              <button type="button" id="reset-btn" class="ghost" title="Reset page">
                Reset
              </button>
              <button type="button" id="logs-btn" class="ghost" title="Companion logs" aria-expanded="false">
                Logs
              </button>
              <button type="button" id="settings-btn" class="ghost" title="Settings">
                Settings
              </button>
            </div>
            <div class="composer-well">
              <div id="attach-host" class="attach-host"></div>
              <textarea
                id="prompt"
                rows="1"
                placeholder="How can I help?"
                autocomplete="off"
                spellcheck="false"
              ></textarea>
              <div class="composer-toolbar">
                <div id="conn-host" class="conn-host"></div>
                <button type="button" id="send-btn" class="ghost send" title="Send">
                  <span class="send-icon" aria-hidden="true">↑</span>
                  <span class="stop-icon" aria-hidden="true"></span>
                </button>
              </div>
            </div>
          </footer>
        </div>
      </div>
    </div>
    <iframe
      id="sandbox-frame"
      src="../sandbox/sandbox.html"
      sandbox="allow-scripts"
      hidden
    ></iframe>
    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
