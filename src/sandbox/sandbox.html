<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Monocle Sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 0;
        height: 0;
        overflow: hidden;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var hostState = {
          media: [],
          viewport: { width: 0, height: 0 },
          queries: {},
        };
        var runtimeCleanups = [];
        var pendingRafs = {};
        var rafSeq = 1;
        var runtimeTimeouts = [];
        var runtimeToken = "";
        var pendingStyles = [];
        var styleFlushScheduled = false;
        var errorStreak = 0;
        var overrunStreak = 0;
        var skipNextFrame = false;
        var runtimeTripped = false;
        var createSeq = 1;
        var RAF_ERROR_LIMIT = 3;
        var FRAME_BUDGET_MS = 16;
        var CREATE_CHILD_CAP = 80;

        function backingWidth() {
          return (hostState.viewport && hostState.viewport.width) || 0;
        }

        function backingHeight() {
          return (hostState.viewport && hostState.viewport.height) || 0;
        }

        try {
          Object.defineProperty(window, "innerWidth", {
            configurable: true,
            get: function () {
              return backingWidth();
            },
          });
          Object.defineProperty(window, "innerHeight", {
            configurable: true,
            get: function () {
              return backingHeight();
            },
          });
        } catch (e) {}

        window.cancelAnimationFrame = function (id) {
          delete pendingRafs[id];
        };

        window.requestAnimationFrame = function (fn) {
          var id = rafSeq++;
          pendingRafs[id] = fn;
          return id;
        };

        var nativeSetTimeout = window.setTimeout.bind(window);
        var nativeSetInterval = window.setInterval.bind(window);
        window.setTimeout = function (fn, ms) {
          if (typeof fn !== "function") return nativeSetTimeout(fn, ms);
          return nativeSetTimeout(function () {
            if (runtimeTripped) return;
            try {
              fn();
              errorStreak = 0;
            } catch (e) {
              noteCallbackError(e);
            }
          }, ms);
        };
        window.setInterval = function (fn, ms) {
          if (typeof fn !== "function") return nativeSetInterval(fn, ms);
          return nativeSetInterval(function () {
            if (runtimeTripped) return;
            try {
              fn();
              errorStreak = 0;
            } catch (e) {
              noteCallbackError(e);
            }
          }, ms);
        };

        function postParent(payload) {
          parent.postMessage(
            Object.assign({ source: "monacle-sandbox", token: runtimeToken }, payload),
            "*",
          );
        }

        function reply(id, payload) {
          postParent({
            type: "monacle-patch-result",
            id: id,
            patch: payload.patch,
            error: payload.error,
          });
        }

        function stopRuntimeLocal() {
          for (var i = 0; i < runtimeCleanups.length; i++) {
            try {
              runtimeCleanups[i]();
            } catch (e) {}
          }
          runtimeCleanups = [];
          pendingRafs = {};
          pendingStyles = [];
          styleFlushScheduled = false;
          errorStreak = 0;
          overrunStreak = 0;
          skipNextFrame = false;
          for (var k = 0; k < runtimeTimeouts.length; k++) {
            clearTimeout(runtimeTimeouts[k]);
          }
          runtimeTimeouts = [];
        }

        function tripRuntime(message) {
          if (runtimeTripped) return;
          runtimeTripped = true;
          stopRuntimeLocal();
          postParent({
            type: "monacle-runtime-error",
            fatal: true,
            message: message || "Scene runtime stopped",
          });
        }

        function noteCallbackError(err) {
          var message = err && err.message ? err.message : String(err);
          errorStreak += 1;
          var fatal = errorStreak >= RAF_ERROR_LIMIT;
          postParent({
            type: "monacle-runtime-error",
            fatal: fatal,
            message: message,
          });
          if (fatal) {
            runtimeTripped = true;
            stopRuntimeLocal();
          }
        }

        window.addEventListener("error", function (ev) {
          noteCallbackError(ev.error || ev.message || "uncaught error");
          ev.preventDefault();
        });
        window.addEventListener("unhandledrejection", function (ev) {
          noteCallbackError(ev.reason || "unhandled rejection");
          ev.preventDefault();
        });

        function applyHostState(data) {
          if (data.media) hostState.media = data.media;
          if (data.viewport) hostState.viewport = data.viewport;
          if (data.queries) hostState.queries = data.queries;
        }

        function flushRafs(time) {
          if (runtimeTripped) return;
          if (skipNextFrame) {
            skipNextFrame = false;
            return;
          }
          var start = performance.now();
          var ids = Object.keys(pendingRafs);
          var failed = false;
          for (var i = 0; i < ids.length; i++) {
            var id = ids[i];
            var fn = pendingRafs[id];
            delete pendingRafs[id];
            if (typeof fn === "function") {
              try {
                fn(time);
              } catch (e) {
                failed = true;
                noteCallbackError(e);
                if (runtimeTripped) return;
              }
            }
          }
          if (!failed) errorStreak = 0;
          var elapsed = performance.now() - start;
          if (elapsed > FRAME_BUDGET_MS) {
            skipNextFrame = true;
            overrunStreak += 1;
            if (elapsed > FRAME_BUDGET_MS * 4 && overrunStreak >= RAF_ERROR_LIMIT) {
              tripRuntime("Runtime frame budget exceeded");
            }
          } else {
            overrunStreak = 0;
          }
        }

        function postStyle(selector, index, props) {
          var flat = {};
          if (props && typeof props === "object") {
            for (var key in props) {
              if (Object.prototype.hasOwnProperty.call(props, key)) {
                var v = props[key];
                if (typeof v === "string" || typeof v === "number") {
                  flat[key] = String(v);
                }
              }
            }
          }
          pendingStyles.push({ selector: selector, index: index, props: flat });
          if (!styleFlushScheduled) {
            styleFlushScheduled = true;
            setTimeout(flushPendingStyles, 0);
          }
        }

        function flushPendingStyles() {
          styleFlushScheduled = false;
          if (!pendingStyles.length) return;
          var batch = pendingStyles;
          pendingStyles = [];
          var merged = {};
          for (var i = 0; i < batch.length; i++) {
            var item = batch[i];
            var key = item.selector + "\0" + item.index;
            if (!merged[key]) {
              merged[key] = {
                selector: item.selector,
                index: item.index,
                props: {},
              };
            }
            var props = item.props || {};
            for (var p in props) {
              if (Object.prototype.hasOwnProperty.call(props, p)) {
                merged[key].props[p] = props[p];
              }
            }
          }
          for (var k in merged) {
            if (!Object.prototype.hasOwnProperty.call(merged, k)) continue;
            var m = merged[k];
            postParent({
              type: "monacle-host-call",
              method: "style",
              args: [m.selector, m.index, m.props],
            });
          }
        }

        function wrapQueryNodes(selector, nodes) {
          var out = [];
          for (var i = 0; i < nodes.length; i++) {
            out.push(wrapQueryNode(selector, i, nodes[i]));
          }
          return out;
        }

        function wrapQueryNode(selector, index, node) {
          if (!node || typeof node !== "object") return node;
          var styleProxy = new Proxy(
            {},
            {
              set: function (_target, prop, value) {
                if (typeof prop !== "string") return true;
                var props = {};
                props[prop] = value == null ? "" : String(value);
                postStyle(selector, index, props);
                return true;
              },
              get: function (target, prop) {
                return target[prop];
              },
            },
          );
          return new Proxy(node, {
            get: function (target, prop, receiver) {
              if (prop === "style") return styleProxy;
              return Reflect.get(target, prop, receiver);
            },
            set: function (target, prop, value) {
              if (prop === "style" && value && typeof value === "object") {
                postStyle(selector, index, value);
                return true;
              }
              target[prop] = value;
              return true;
            },
          });
        }

        function countTopLevelElements(html) {
          try {
            var t = document.createElement("template");
            t.innerHTML = String(html || "").trim();
            var n = 0;
            for (var i = 0; i < t.content.childNodes.length; i++) {
              if (t.content.childNodes[i].nodeType === 1) {
                n += 1;
                if (n >= CREATE_CHILD_CAP) break;
              }
            }
            return n;
          } catch (e) {
            return 0;
          }
        }

        function nextBatchId() {
          return (
            "b" +
            Date.now().toString(36) +
            "_" +
            (createSeq++).toString(36)
          );
        }

        function batchSelector(batchId) {
          return '[data-monacle-batch="' + batchId + '"]';
        }

        function placeholderNodes(selector, count) {
          var out = [];
          for (var i = 0; i < count; i++) {
            out.push(
              wrapQueryNode(selector, i, {
                tag: "div",
                id: "",
                className: "",
                rect: { x: 0, y: 0, width: 0, height: 0 },
              }),
            );
          }
          return out;
        }

        /** Create host DOM nodes; returns style-proxy handles immediately. */
        function createOnHost(html, opts) {
          opts = opts || {};
          var batchId = opts.batchId || nextBatchId();
          var selector = batchSelector(batchId);
          var count = Math.min(countTopLevelElements(html), CREATE_CHILD_CAP);
          var callOpts = {
            batchId: batchId,
            position: opts.position,
          };
          if (opts.selector) callOpts.selector = opts.selector;
          postParent({
            type: "monacle-host-call",
            method: opts._method || "create",
            args: [html, callOpts],
          });
          return placeholderNodes(selector, count);
        }

        function buildMonacle() {
          function threeCall(cmd, a, b) {
            var args = [cmd];
            if (arguments.length > 1) args.push(a);
            if (arguments.length > 2) args.push(b);
            postParent({
              type: "monacle-host-call",
              method: "three",
              args: args,
            });
          }
          return {
            query: function (selector) {
              postParent({
                type: "monacle-host-call",
                method: "query",
                args: [selector],
              });
              var nodes = (hostState.queries && hostState.queries[selector]) || [];
              return wrapQueryNodes(selector, nodes);
            },
            create: function (html, opts) {
              return createOnHost(html, opts || {});
            },
            insert: function (html, opts) {
              opts = opts || {};
              return createOnHost(html, {
                selector: opts.selector || "body",
                position: opts.position || "append",
                _method: "insert",
              });
            },
            overlay: null,
            canvas: function () {
              throw new Error(
                "monacle.canvas() is disabled — use monacle.create() or monacle.three.*",
              );
            },
            three: {
              clear: function () {
                threeCall("clear");
              },
              ensure: function () {
                threeCall("ensure");
              },
              setBackground: function (value) {
                threeCall("setBackground", value);
              },
              add: function (spec) {
                threeCall("add", spec || {});
              },
              update: function (id, props) {
                threeCall("update", id, props || {});
              },
              remove: function (id) {
                threeCall("remove", id);
              },
              camera: function (spec) {
                threeCall("camera", spec || {});
              },
              lights: function (list) {
                threeCall("lights", list || []);
              },
            },
            media: function () {
              return hostState.media || [];
            },
            raf: function (fn) {
              var id = rafSeq++;
              pendingRafs[id] = fn;
              return id;
            },
            timeout: function (fn, ms) {
              var id = setTimeout(function () {
                runtimeTimeouts = runtimeTimeouts.filter(function (x) {
                  return x !== id;
                });
                if (runtimeTripped) return;
                try {
                  fn();
                  errorStreak = 0;
                } catch (e) {
                  noteCallbackError(e);
                }
              }, ms);
              runtimeTimeouts.push(id);
              return id;
            },
            onCleanup: function (fn) {
              runtimeCleanups.push(fn);
            },
            css: function (text) {
              postParent({
                type: "monacle-host-call",
                method: "css",
                args: [text],
              });
            },
          };
        }

        function runPatchCode(id, code, context) {
          var settled = false;
          var postMessageShim = function (msg) {
            if (settled) return;
            if (!msg || typeof msg !== "object") return;
            if (msg.type === "monacle-patch") {
              settled = true;
              reply(id, { patch: msg.patch || null });
            }
          };

          try {
            var fn = new Function(
              "snapshot",
              "postMessage",
              '"use strict";\n' + code,
            );
            fn(context, postMessageShim);

            if (!settled) {
              setTimeout(function () {
                if (!settled) {
                  settled = true;
                  reply(id, {
                    error:
                      "Sandbox JS did not postMessage({ type: 'monacle-patch', patch })",
                  });
                }
              }, 50);
            }
          } catch (err) {
            settled = true;
            reply(id, {
              error: err && err.message ? err.message : String(err),
            });
          }
        }

        function runLiveRuntime(code) {
          try {
            var run = new Function(
              "monacle",
              "chrome",
              "browser",
              '"use strict";\n' + code,
            );
            run(buildMonacle(), undefined, undefined);
          } catch (err) {
            noteCallbackError(err);
          }
        }

        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || data.source !== "monacle-host") return;

          if (data.type === "monacle-run") {
            runPatchCode(data.id, data.code, data.context);
            return;
          }

          // Host liveness probe — ignore (frame reuse checks contentWindow).
          if (data.type === "monacle-ping") {
            return;
          }

          if (data.type === "monacle-host-state") {
            applyHostState(data);
            return;
          }

          if (data.type === "monacle-raf-tick") {
            applyHostState(data);
            flushRafs(data.time);
            return;
          }

          if (data.type === "monacle-runtime-stop") {
            stopRuntimeLocal();
            return;
          }

          if (data.type === "monacle-runtime-start") {
            stopRuntimeLocal();
            runtimeTripped = false;
            if (data.token) runtimeToken = data.token;
            applyHostState(data);
            runLiveRuntime(data.code || "");
          }
        });

        parent.postMessage(
          { source: "monacle-sandbox", type: "monacle-ready" },
          "*",
        );
      })();
    </script>
  </body>
</html>
